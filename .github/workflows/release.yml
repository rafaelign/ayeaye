name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev clang file \
            libegl1-mesa-dev libgl1-mesa-dev libgbm-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev

      - name: Build .deb
        run: packaging/linux/build-deb.sh

      - name: Build AppImage
        run: packaging/linux/build-appimage.sh

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/appimage/*.AppImage
